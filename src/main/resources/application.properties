spring.application.name=storefront-node

storefront.branch-code=AIR01
storefront.currency=AED
storefront.zone=Asia/Dubai
storefront.outbox.relay-enabled=true
storefront.outbox.poll-interval-ms=200
storefront.outbox.batch-size=250
storefront.outbox.lease=30s

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/storefront}
spring.datasource.username=${DB_USER:storefront}
spring.datasource.password=${DB_PASSWORD:storefront}

# Bounded pool, fail-fast acquisition and bounded lock waits keep rush load from piling up
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.connection-init-sql=SET lock_timeout = '2s'

spring.flyway.locations=classpath:db/migration
spring.threads.virtual.enabled=true

management.endpoints.web.exposure.include=health,info
